<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PID 训练场 · 倒立摆三关 · ARES</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
window.onerror = function (msg, src, line, col) {
  document.title = 'ERR ' + msg + ' @' + line + ':' + col;
  var el = document.getElementById('errbox') || (function () {
    var d = document.createElement('div');
    d.id = 'errbox';
    d.style.cssText = 'position:fixed;left:8px;top:8px;z-index:9999;background:#5b1a1a;color:#fff;padding:8px 12px;border-radius:6px;font:12px monospace;max-width:90%;word-break:break-all;';
    document.body.appendChild(d);
    return d;
  })();
  el.textContent = 'ERR: ' + msg + ' @' + line + ':' + col;
  return false;
};
window.addEventListener('load', function () {
  if (typeof Chart === 'undefined') {
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js';
    s.onload = initChart;
    s.onerror = function () { document.getElementById('chart-note').textContent = '图表库加载失败，请检查网络'; };
    document.head.appendChild(s);
  } else {
    initChart();
  }
});
</script>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2233;
    --panel2: #222c40;
    --text: #e8ecf3;
    --muted: #8b96a8;
    --accent: #4fc3f7;
    --green: #66d98a;
    --orange: #ffb74d;
    --red: #ff6b6b;
    --blue: #64b5f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding: 16px;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  h1 .sub { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .layout { display: grid; grid-template-columns: minmax(320px, 1fr) 420px; gap: 16px; max-width: 1400px; margin: 12px auto; }
  .card { background: var(--panel); border-radius: 12px; padding: 16px; border: 1px solid #2a3550; }
  .card h2 { font-size: 14px; color: var(--accent); margin-bottom: 10px; font-weight: 600; }
  /* 关卡切换（紧凑） */
  .level-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .level-btn {
    background: var(--panel2); border: 1px solid #33405e; color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    text-align: center; line-height: 1.3; font-weight: 600; flex: 1; min-width: 90px;
  }
  .level-btn small { display: none; }
  .level-btn.active { border-color: var(--accent); color: var(--accent); background: #1c2c44; }
  #pendulum-wrap { position: relative; }
  #pendulum { width: 100%; height: auto; aspect-ratio: 4 / 3; display: block; touch-action: none; cursor: grab; }
  #pendulum:active { cursor: grabbing; }
  .drag-hint { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); background: rgba(15,20,32,.75); padding: 4px 12px; border-radius: 20px; pointer-events: none; text-align: center; white-space: nowrap; max-width: 95%; overflow: hidden; text-overflow: ellipsis; }
  /* 悬浮按钮：放在可视化窗口内底部 */
  .overlay-btns { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 5; }
  .overlay-btns .btn { padding: 6px 12px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .overlay-btns .btn:hover { filter: brightness(1.1); }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .row label { font-size: 13px; color: var(--muted); min-width: 110px; }
  .row .val { font-size: 13px; color: var(--text); min-width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=number], input[type=text] { background: var(--panel2); border: 1px solid #33405e; color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 86px; font-variant-numeric: tabular-nums; }
  input[type=number]:focus, input[type=text]:focus { outline: 1px solid var(--accent); }
  .pid-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pid-item { background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
  .pid-item .k { font-size: 17px; font-weight: 700; color: var(--accent); }
  .pid-item .n { font-size: 11px; color: var(--muted); }
  .btn { background: var(--accent); border: none; color: #0f1420; font-weight: 600; padding: 8px 14px;
    border-radius: 8px; font-size: 13px; cursor: pointer; }
  .btn.ghost { background: transparent; border: 1px solid #33405e; color: var(--text); }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { background: var(--panel2); border: 1px solid #33405e; border-radius: 20px; color: var(--text);
    font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel2); border-radius: 8px; padding: 10px; text-align: center; }
  .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #chart { width: 100%; height: 320px; position: relative; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .note b { color: var(--orange); font-weight: 600; }
  .running-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; }
  .paused-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot-fail { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 6px; }
  .lvl-desc { font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 6px; }
  /* 移动端选项卡（桌面隐藏，三块并排显示） */
  .mobile-tabs { display: none; }
  @media (min-width: 981px) {
    /* 桌面 fit 一屏：不滚动，可视化占满剩余高度 */
    html, body { height: 100%; overflow: hidden; }
    body { padding: 12px 16px; display: flex; flex-direction: column; }
    .layout { height: calc(100vh - 70px); margin-top: 8px; align-items: stretch; }
    .col-left { display: flex; flex-direction: column; min-height: 0; }
    .col-right { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; overflow-x: hidden; }
    #pendulum-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px; }
    #pendulum { width: 100%; height: auto; aspect-ratio: 4 / 3; max-height: 100%; object-fit: contain; }
    .col-right .card { margin-bottom: 10px; }
    .col-right .card:last-child { margin-bottom: 0; }
    #chart { height: 200px; }
  }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    body { padding: 10px; }
    h1 { font-size: 18px; }
    h1 .sub { display: block; margin-left: 0; margin-top: 2px; }
    #chart { height: 240px; }
    /* 上下分屏：顶部选关 → 可视化 → 下方选项卡 */
    .layout { display: block; }
    .col-left { margin-bottom: 0; }
    .col-right { margin-top: 10px; }
    .mobile-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .mtab {
      flex: 1; background: var(--panel2); border: 1px solid #33405e; color: var(--muted);
      border-radius: 8px; padding: 8px 0; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .mtab.active { border-color: var(--accent); color: var(--accent); background: #1c2c44; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    #pendulum { aspect-ratio: 4 / 3; }
  }
  @media (max-width: 420px) {
    .pid-grid { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(3, 1fr); }
    input[type=range] { min-height: 32px; }
  }
</style>
</head>
<body>
  <h1>倒立摆 PID 训练场 <span class="sub">ARES · Robocon 2027 · 三关卡</span></h1>
  <div class="layout">
    <div class="col-left">
      <!-- 关卡选择 -->
      <div class="level-tabs">
        <button class="level-btn active" data-lvl="1">第一关 · 扭矩摆立起来<small>枢轴电机扭矩直控 · 目标 0°</small></button>
        <button class="level-btn" data-lvl="2">第二关 · 末端转圈<small>目标角度匀速旋转 · 跟踪圆形轨迹</small></button>
        <button class="level-btn" data-lvl="3">第三关 · Cart-Pole 回原点<small>小车水平力平衡摆杆 · 位置也要回零</small></button>
      </div>

      <div class="card" id="pendulum-wrap">
        <h2>系统状态 <span id="state-dot" style="font-size:12px;"><span class="paused-dot"></span>已暂停</span></h2>
        <canvas id="pendulum" width="640" height="480"></canvas>
        <div class="drag-hint" id="drag-hint">拖动摆球可创建扰动（松手后恢复动力学）</div>
        <div class="overlay-btns">
          <button class="btn" id="btn-run">▶ 开始</button>
          <button class="btn ghost" id="btn-reset">↺ 重置</button>
          <button class="btn ghost" id="btn-random">🎲 换质量</button>
        </div>
      </div>
    </div>

    <div class="col-right">
      <!-- 移动端选项卡（桌面端自动隐藏，三块并排） -->
      <div class="mobile-tabs">
        <button class="mtab active" data-tab="pid">PID 参数</button>
        <button class="mtab" data-tab="chart">图表</button>
        <button class="mtab" data-tab="result">控制结果</button>
      </div>

      <!-- PID 参数 -->
      <div class="tab-panel active" id="tab-pid">
        <div class="card">
          <h2>控制器参数 <span id="ctrl-name" class="note"></span></h2>
          <div class="pid-grid" id="pid-grid"></div>
          <div class="chips" id="chips"></div>
        </div>
      </div>

      <!-- 图表 -->
      <div class="tab-panel" id="tab-chart">
        <div class="card">
          <h2>实时数据 <span class="note" style="float:right;">观测 vs 真值 vs 目标</span></h2>
          <div class="stat-grid" style="margin-bottom:12px;" id="stats"></div>
          <div id="chart"><canvas id="chart-canvas"></canvas></div>
          <div id="chart-note" class="note" style="margin-top:6px;">曲线窗口：最近 5 秒 @50Hz 采样</div>
          <div id="chart-x-wrap" style="display:none; margin-top:14px;">
            <h3 style="margin:0 0 6px 0; font-size:14px;">小车位置 x <span class="note" style="font-size:11px;">外环</span></h3>
            <div id="chart-x"><canvas id="chart-canvas-x"></canvas></div>
          </div>
          <div id="chart-u-wrap" style="display:none; margin-top:14px;">
            <h3 style="margin:0 0 6px 0; font-size:14px;">输出分解 <span class="note" style="font-size:11px;" id="chart-u-title">Kp / Ki / Kd 分量</span></h3>
            <div id="chart-u"><canvas id="chart-canvas-u"></canvas></div>
          </div>
          <div id="chart-u2-wrap" style="display:none; margin-top:14px;">
            <h3 style="margin:0 0 6px 0; font-size:14px;">外环输出分解 <span class="note" style="font-size:11px;">KpX / KiX / KdX 分量 (θref)</span></h3>
            <div id="chart-u2"><canvas id="chart-canvas-u2"></canvas></div>
          </div>
        </div>
      </div>

      <!-- 控制结果 -->
      <div class="tab-panel" id="tab-result">
        <div class="card">
          <h2>控制结果</h2>
          <div class="stat-grid" style="margin-bottom:12px;" id="result-stats"></div>
          <p class="note" id="result-note" style="margin-top:6px;"></p>
        </div>
      </div>
    </div>
  </div>

<script>
// ==================== 通用常量 ====================
const G = 9.81;
const PHYS_DT = 0.001;   // 物理步长 1ms
const CTRL_DT = 0.02;    // 控制周期 50Hz
const DEG = 180 / Math.PI;

// ==================== 仿真状态 ====================
const sim = {
  level: 1,
  running: false, paused: false, dragging: false,
  t: 0,
  // 第一/二关（扭矩摆）
  m: 1.2, L: 1.0, b: 0.06,
  theta: 0, omega: 0,
  theta0: 30 * Math.PI / 180,
  omegaRef: 0.6,        // 第二关转速 rad/s
  // 第三关（cart-pole）
  M: 1.5,                // 小车质量（固定）
  pc_m: 0.5,             // 摆杆质量（随机）
  pc_L: 0.6,             // 摆杆半长（质心距离）
  x: 0, xdot: 0,
  x0: 0.3,
  theta0L3: 5 * Math.PI / 180,
  trackMax: 5,           // 轨道半长 ±5m，碰边失败
  failed: false,         // 碰边失败标志（暂停等待重置）
  // 控制器（出题默认：P1 I0 D0，让同学自己探索）
  Kp: 1, Ki: 0, Kd: 0, uMax: 15,
  Tf1: 0,                // L1/L2 D 项一阶低通时间常数（s），0=不滤波
  KpTh: 1, KiTh: 0, KdTh: 0, KpX: 0, KiX: 0, KdX: 0, fMax: 30, thetaRefMax: 0.1,
  TfTh: 0,               // 内环 D 项一阶低通时间常数（s），0=不滤波
  TfX: 0,                // 外环 D 项一阶低通时间常数（s），0=不滤波
  measTfTh: 0,           // 角度观测总低通（s），0=不滤波
  measTfX: 0,            // 位置观测总低通（s），0=不滤波
  noiseSigma: 0.0125,    // L1/L2 观测噪声 σ (rad)
  noiseSigmaTh: 0.0125,  // L3 角度观测噪声 σ (rad)
  noiseSigmaX: 0.01,     // L3 位置观测噪声 σ (m)
  integral: 0, prevErr: 0, hasPrev: false,
  prevEX: 0, hasPrevX: false, prevX: 0, wF: 0, xdF: 0, wF1: 0,
  obsTheta: 0, obsX: 0,
  bufT: [], bufTrue: [], bufObs: [], bufTgt: [], bufX: [], bufObsX: [],
  bufUKp: [], bufUKi: [], bufUKd: [],   // L1/L2 输出分量（N·m）；L3 内环 F 分量（N）
  bufUKp2: [], bufUKi2: [], bufUKd2: [], // L3 外环 θref 分量（rad）
  targetNow: 0, uNow: 0,
  uKpNow: 0, uKiNow: 0, uKdNow: 0, uKp2Now: 0, uKi2Now: 0, uKd2Now: 0,
};

// ==================== 关卡定义 ====================
const LEVELS = {
  1: {
    name: '扭矩摆 · 立起来',
    desc: '电机直接对枢轴施加力矩，把偏摆的杆子立到 0°。观测有噪声，真值不可见。',
    init() {
      sim.m = randomMass(0.6, 1.8);
      sim.theta = sim.theta0; sim.omega = 0;
      sim.targetNow = 0;
      pidReset();
    },
    draw() { drawPendulum(0); },
    setupRows() {
      return [
        slider('theta0', '初始偏离角度', -180, 180, 1, 30, '°', v => { sim.theta0 = v / DEG; }),
        slider('noise', '观测噪声 σ', 0, 200, 1, 25, ' rad', v => sim.noiseSigma = v / 1000),
        slider('len', '摆长 L', 0.3, 0.8, 0.01, 0.5, ' m', v => { sim.L = v; refreshMass(); }),
        staticRow('摆球质量 m', () => sim.m.toFixed(2) + ' kg'),
      ];
    },
    pidUI() {
      return [
        pidInput('kp', 'Kp', '比例/Proportional', 1),
        pidInput('ki', 'Ki', '积分/Integral', 0),
        pidInput('kd', 'Kd', '微分/Derivative', 0),
        pidInput('umax', '限幅', '输出上限 N·m', 15),
        pidInput('tf1', 'Tf', 'D 项滤波 (s)', 0),
        pidInput('tfm', 'TfM', '测量值滤波 (s)', 0),
      ];
    },
    chips() {
      return [
        ['P1 I0 D0（出题默认）', [1, 0, 0, 15, 0, 0]],
      ];
    },
    pidDefaults() { return [1, 0, 0, 15, 0, 0]; },
    pidApply(v) { sim.Kp = v[0]; sim.Ki = v[1]; sim.Kd = v[2]; sim.uMax = v[3]; sim.Tf1 = v[4]; sim.measTfTh = v[5]; },
    ctrl() {
      // 标准 PID：D 项一阶低通（Tf1 可调），积分+差分自维护
      const e = sim.targetNow - sim.obsTheta;
      sim.wF1 += (CTRL_DT / (CTRL_DT + sim.Tf1)) * (((e - sim.prevErr) / CTRL_DT) - sim.wF1);
      sim.integral = clamp(sim.integral + e * CTRL_DT, -20, 20);
      sim.prevErr = e; sim.hasPrev = true;
      sim.uKpNow = sim.Kp * e;
      sim.uKiNow = sim.Ki * sim.integral;
      sim.uKdNow = sim.Kd * sim.wF1;
      return clamp(sim.uKpNow + sim.uKiNow + sim.uKdNow, -sim.uMax, sim.uMax);
    },
    target(t) { return 0; },
    stats() {
      return [['真值角度', fmtDeg(sim.theta), 'var(--green)'],
              ['观测角度', fmtDeg(sim.obsTheta), 'var(--orange)'],
              ['输出 u', sim.uNow.toFixed(2) + ' N·m', 'var(--blue)']];
    },
    dragHint: '拖动摆球可创建扰动（松手后恢复动力学）',
    chartX: true,
  },
  2: {
    name: '扭矩摆 · 末端匀速转圈',
    desc: '目标角度以恒定角速度持续上升，摆杆末端沿圆周匀速旋转。PID 跟踪匀速斜坡：比例段会稳态滞后，调好积分才跟得上。',
    init() {
      sim.m = randomMass(0.6, 1.8);
      sim.theta = sim.theta0; sim.omega = 0;
      sim.targetNow = sim.theta0;
      pidReset();
    },
    draw() { drawPendulum(2); },
    setupRows() {
      return [
        slider('theta0', '初始角度', -180, 180, 1, 30, '°', v => { sim.theta0 = v / DEG; }),
        slider('omegaRef', '目标转速 ω', 0.2, 2.0, 0.05, 0.6, ' rad/s', v => sim.omegaRef = v),
        slider('noise', '观测噪声 σ', 0, 200, 1, 25, ' rad', v => sim.noiseSigma = v / 1000),
        slider('len', '摆长 L', 0.3, 0.8, 0.01, 0.5, ' m', v => { sim.L = v; refreshMass(); }),
        staticRow('摆球质量 m', () => sim.m.toFixed(2) + ' kg'),
      ];
    },
    pidUI() {
      return [
        pidInput('kp', 'Kp', '比例/Proportional', 1),
        pidInput('ki', 'Ki', '积分/Integral', 0),
        pidInput('kd', 'Kd', '微分/Derivative', 0),
        pidInput('umax', '限幅', '输出上限 N·m', 25),
        pidInput('tf1', 'Tf', 'D 项滤波 (s)', 0),
        pidInput('tfm', 'TfM', '测量值滤波 (s)', 0),
      ];
    },
    chips() {
      return [
        ['P1 I0 D0（出题默认）', [1, 0, 0, 25, 0, 0]],
      ];
    },
    pidDefaults() { return [1, 0, 0, 25, 0, 0]; },
    pidApply(v) { sim.Kp = v[0]; sim.Ki = v[1]; sim.Kd = v[2]; sim.uMax = v[3]; sim.Tf1 = v[4]; sim.measTfTh = v[5]; },
    ctrl() {
      // 标准 PID：D 项一阶低通（Tf1 可调）
      const e = sim.targetNow - sim.obsTheta;
      sim.wF1 += (CTRL_DT / (CTRL_DT + sim.Tf1)) * (((e - sim.prevErr) / CTRL_DT) - sim.wF1);
      sim.integral = clamp(sim.integral + e * CTRL_DT, -20, 20);
      sim.prevErr = e; sim.hasPrev = true;
      sim.uKpNow = sim.Kp * e;
      sim.uKiNow = sim.Ki * sim.integral;
      sim.uKdNow = sim.Kd * sim.wF1;
      return clamp(sim.uKpNow + sim.uKiNow + sim.uKdNow, -sim.uMax, sim.uMax);
    },
    target(t) { return sim.theta0 + sim.omegaRef * t; },
    stats() {
      return [['真值角度', fmtDeg(sim.theta), 'var(--green)'],
              ['观测角度', fmtDeg(sim.obsTheta), 'var(--orange)'],
              ['输出 u', sim.uNow.toFixed(2) + ' N·m', 'var(--blue)']];
    },
    dragHint: '拖动摆球可创建扰动（松手后恢复动力学）',
    chartX: true,
  },
  3: {
    name: 'Cart-Pole · 小车回原点',

    pidUI() {

        cols: [
          [

          ],
          [

            pidInput('kdx', 'Kdx', '外环·位置阻尼', 0),
            pidInput('tfx', 'TfX', '外环 D 滤波 (s)', 0),
            pidInput('threfmax', 'θref限幅', '外环·倾角上限 rad', 0.1),
            pidInput('tfmx', 'TfMX', '外环·位置测量滤波 (s)', 0),
          ],
        ],
        extras: [],
      };
    },
    chips() {
      return [
        ['P1 I0 D0（出题默认）', [1, 0, 0, 0, 30, 0, 0, 0, 0, 0.1, 0, 0]],
      ];
    },
    pidDefaults() { return [1, 0, 0, 0, 30, 0, 0, 0, 0, 0.1, 0, 0]; },
    pidApply(v) { sim.KpTh = v[0]; sim.KiTh = v[1]; sim.KdTh = v[2]; sim.TfTh = v[3]; sim.fMax = v[4]; sim.KpX = v[5]; sim.KiX = v[6]; sim.KdX = v[7]; sim.TfX = v[8]; sim.thetaRefMax = v[9]; sim.measTfTh = v[10]; sim.measTfX = v[11]; },
    ctrl() {
      // 标准串级 PID：
      // 外环：e_x = 0 - x → PID → θref（限幅 ±0.1 rad 预倾，避免内环被拉离稳定域）
      // 内环：e_θ = θ - θref → PID → F（杆右偏 θ>θref → 车向右追）
      // D 项均为一阶低通（Tf 可调），抑制观测差分噪声
      const eX = -sim.obsX;
      sim.xdF += (CTRL_DT / (CTRL_DT + sim.TfX)) * (((eX - sim.prevEX) / CTRL_DT) - sim.xdF);
      sim.integX = clamp(sim.integX + eX * CTRL_DT, -5, 5);
      sim.prevEX = eX; sim.hasPrevX = true;
      sim.uKp2Now = sim.KpX * eX;
      sim.uKi2Now = sim.KiX * sim.integX;
      sim.uKd2Now = sim.KdX * sim.xdF;
      const thetaRef = clamp(sim.uKp2Now + sim.uKi2Now + sim.uKd2Now, -sim.thetaRefMax, sim.thetaRefMax);
      sim.thetaRefNow = thetaRef;
      // 内环（D 项低通）
      const eTh = sim.obsTheta - thetaRef;
      sim.wF += (CTRL_DT / (CTRL_DT + sim.TfTh)) * ((sim.obsTheta - sim.obsThetaPrev) / CTRL_DT - sim.wF);
      const dTh = sim.wF;
      sim.integTh = clamp(sim.integTh + eTh * CTRL_DT, -5, 5);
      sim.prevErr = eTh; sim.hasPrev = true;
      sim.uKpNow = sim.KpTh * eTh;
      sim.uKiNow = sim.KiTh * sim.integTh;
      sim.uKdNow = sim.KdTh * dTh;
      return clamp(sim.uKpNow + sim.uKiNow + sim.uKdNow, -sim.fMax, sim.fMax);
    },
    target(t) { return 0; },
    stats() {
      return [['摆角 θ', fmtDeg(sim.theta), 'var(--green)'],
              ['小车位置 x', (sim.x).toFixed(3) + ' m', 'var(--orange)'],
              ['输出 F', sim.uNow.toFixed(2) + ' N', 'var(--blue)']];
    },
    dragHint: '拖摆球改摆角，拖小车改位置（松手恢复动力学）',
    chartX: true,
  },
};

// ==================== 小工具 ====================
function randomMass(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function fmtDeg(r) { return (r * DEG).toFixed(1) + '°'; }
function pidReset() {
  sim.integral = 0; sim.prevErr = 0; sim.hasPrev = false; sim.prevX = 0;
  sim.prevEX = 0; sim.hasPrevX = false; // L3 外环差分复位
  sim.integTh = 0; sim.integX = 0; // L3 双环积分复位
  sim.wF = 0; sim.xdF = 0; sim.wF1 = 0; // D 项低通复位
}

// ==================== 物理：扭矩摆（第一/二关） ====================
function stepPendulum(u) {
  const tau = sim.m * sim.L * sim.L;
  const alpha = (G / sim.L) * Math.sin(sim.theta) + u / tau - (sim.b / tau) * sim.omega;
  sim.omega += alpha * PHYS_DT;
  sim.theta += sim.omega * PHYS_DT;
}

// ==================== 物理：cart-pole（第三关） ====================
// 经典均匀杆模型（总长 2L，质心距枢轴 L，绕质心惯量 I = mL²/3）
// 拉格朗日推导（θ=0 竖直向上，F 向右为正，无摩擦）：
// θ̈ = [g·sinθ − cosθ·(F + mL·ω²·sinθ)/(M+m)] / [L·(4/3 − m·cos²θ/(M+m))]
// ẍ = (F + mL(ω²·sinθ − θ̈·cosθ)) / (M+m)  ← 注意 m/(M+m) 因子在合并项里
function stepCartPole(F) {
  const { M, pc_m: m, pc_L: L } = sim;
  const s = Math.sin(sim.theta), c = Math.cos(sim.theta);
  const temp = (F + m * L * sim.omega * sim.omega * s) / (M + m);
  const thAcc = (G * s - c * temp) / (L * (4 / 3 - m * c * c / (M + m)));
  // gymnasium 官方公式：xAcc = temp - m·L·θ̈·cosθ/(M+m)（已验证与官方源码逐位一致）
  const xAcc = temp - L * thAcc * c * (m / (M + m));
  sim.omega += thAcc * PHYS_DT;
  sim.theta += sim.omega * PHYS_DT;
  sim.xdot += xAcc * PHYS_DT;
  sim.x += sim.xdot * PHYS_DT;
  // 自由移动，碰边由主循环判定失败（这里不做限位）
}

function downsample(t, v) {
  if (t.length <= CHART_MAX_PLOT) return t.map((tt, i) => ({ x: tt, y: v[i] }));
  const bucket = Math.ceil(t.length / CHART_MAX_PLOT);
  const out = [];
  for (let i = 0; i < t.length; i += bucket) {
    const end = Math.min(i + bucket, t.length);
    let mn = Infinity, mx = -Infinity, mnV = 0, mxV = 0;
    for (let j = i; j < end; j++) {
      if (v[j] < mn) { mn = v[j]; mnV = v[j]; }
      if (v[j] > mx) { mx = v[j]; mxV = v[j]; }
    }
    out.push({ x: t[i], y: mnV }, { x: t[end - 1], y: mxV });
  }
  return out;
}

// ==================== 画布：扭矩摆 ====================
const cv = document.getElementById('pendulum');
const ctx = cv.getContext('2d');
const cvW = cv.width, cvH = cv.height;
const PIVOT = { x: cvW / 2, y: 250 };
const SCALE = 140;

function drawPendulum(mode) {
  const Lpx = sim.L * SCALE;
  ctx.clearRect(0, 0, cvW, cvH);
  // 网格
  ctx.strokeStyle = '#1d2740'; ctx.lineWidth = 1;
  for (let y = 40; y < cvH; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cvW, y); ctx.stroke(); }
  for (let x = 0; x < cvW; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cvH); ctx.stroke(); }

  // 目标角度参考（mode=2 时画转圈的目标轨迹）
  if (mode === 2) {
    ctx.strokeStyle = 'rgba(100,181,246,.8)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(PIVOT.x, PIVOT.y, Lpx, 0, 2 * Math.PI); ctx.stroke();
    ctx.setLineDash([]);
    // 目标指针
    const tgx = PIVOT.x + Lpx * Math.sin(sim.targetNow), tgy = PIVOT.y - Lpx * Math.cos(sim.targetNow);
    ctx.strokeStyle = 'rgba(100,181,246,.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(PIVOT.x, PIVOT.y); ctx.lineTo(tgx, tgy); ctx.stroke();
    ctx.fillStyle = '#64b5f6';
    ctx.beginPath(); ctx.arc(tgx, tgy, 5, 0, 2 * Math.PI); ctx.fill();
    // 轨迹点（只画最近 5 秒 = 250 点，全量遍历会越跑越卡）
    ctx.fillStyle = 'rgba(100,181,246,.25)';
    for (let i = Math.max(0, Math.floor((sim.bufT.length - 250) / 5) * 5); i < sim.bufT.length; i += 5) {
      const px = PIVOT.x + Lpx * Math.sin(sim.bufTrue[i]);
      const py = PIVOT.y - Lpx * Math.cos(sim.bufTrue[i]);
      ctx.beginPath(); ctx.arc(px, py, 2, 0, 2 * Math.PI); ctx.fill();
    }
  } else {
    ctx.strokeStyle = 'rgba(100,181,246,.35)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(PIVOT.x, PIVOT.y);
    ctx.lineTo(PIVOT.x + Lpx * Math.sin(sim.targetNow), PIVOT.y - Lpx * Math.cos(sim.targetNow));
    ctx.stroke(); ctx.setLineDash([]);
  }

  // 竖直参考线
  ctx.strokeStyle = '#2a3550'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PIVOT.x, 30); ctx.lineTo(PIVOT.x, cvH - 30); ctx.stroke();

  // 摆臂
  const endX = PIVOT.x + Lpx * Math.sin(sim.theta);
  const endY = PIVOT.y - Lpx * Math.cos(sim.theta);
  ctx.strokeStyle = '#e8ecf3'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(PIVOT.x, PIVOT.y); ctx.lineTo(endX, endY); ctx.stroke();

  // 摆球
  const r = 18 + 8 * sim.m;
  const grad = ctx.createRadialGradient(endX - r * 0.3, endY - r * 0.3, r * 0.2, endX, endY, r);
  grad.addColorStop(0, '#ffd28a'); grad.addColorStop(1, '#ff8f3d');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(endX, endY, r, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = '#4d2e12'; ctx.lineWidth = 1.5; ctx.stroke();

  // 角度弧线
  ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(PIVOT.x, PIVOT.y, 55, -Math.PI / 2, -Math.PI / 2 + Math.max(-Math.PI, Math.min(Math.PI, sim.theta)), sim.theta < 0);
  ctx.stroke();

  // 枢轴
  ctx.fillStyle = '#2a3550';
  ctx.fillRect(PIVOT.x - 26, PIVOT.y - 8, 52, 24);
  ctx.fillStyle = '#4fc3f7';
  ctx.beginPath(); ctx.arc(PIVOT.x, PIVOT.y, 7, 0, 2 * Math.PI); ctx.fill();

  // 标注
  ctx.fillStyle = '#8b96a8'; ctx.font = '12px sans-serif';
  ctx.fillText('m = ' + sim.m.toFixed(2) + ' kg', 12, 24);
  ctx.fillText('L = ' + sim.L.toFixed(2) + ' m', 12, 42);
  ctx.fillText('θ = ' + (sim.theta * DEG).toFixed(1) + '°', 12, 60);
}

// ==================== 画布：cart-pole ====================
const L3_XSCALE = 620 / (2 * 5.4); // 视野 ±5.4m → 全宽 640px 内留边：约 57.4 px/m
function drawCartPole() {
  ctx.clearRect(0, 0, cvW, cvH);
  // 网格
  ctx.strokeStyle = '#1d2740'; ctx.lineWidth = 1;
  for (let y = 40; y < cvH; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cvW, y); ctx.stroke(); }
  for (let x = 0; x < cvW; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cvH); ctx.stroke(); }

  const groundY = 380;
  const xscale = L3_XSCALE; // m → px
  const cx = cvW / 2 + sim.x * xscale;
  const edgeL = cvW / 2 - 5 * xscale; // -5m 位置
  const edgeR = cvW / 2 + 5 * xscale; // +5m 位置

  // 轨道（贯穿全宽）
  ctx.strokeStyle = '#3a4763'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(10, groundY + 18); ctx.lineTo(cvW - 10, groundY + 18); ctx.stroke();
  // 原点刻度
  ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(cvW / 2, groundY - 20); ctx.lineTo(cvW / 2, groundY + 30); ctx.stroke();
  ctx.setLineDash([]);
  // ±5m 边界线（失败线，红色）
  ctx.strokeStyle = 'rgba(255,107,107,.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(edgeL, 40); ctx.lineTo(edgeL, groundY + 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(edgeR, 40); ctx.lineTo(edgeR, groundY + 30); ctx.stroke();
  ctx.fillStyle = '#ff6b6b'; ctx.font = '11px sans-serif';
  ctx.fillText('-5m 终点', edgeL - 28, 30);
  ctx.fillText('+5m 终点', edgeR + 2, 30);
  ctx.fillStyle = '#8b96a8';
  ctx.fillText('x = 0', cvW / 2 - 14, groundY + 34);
  ctx.fillStyle = 'rgba(255,107,107,.4)'; ctx.font = '10px sans-serif';
  ctx.fillText('碰边即失败', cvW - 92, 46);

  // 小车
  const carW = 90, carH = 34;
  ctx.fillStyle = '#3d4b6b';
  ctx.fillRect(cx - carW / 2, groundY - carH, carW, carH);
  ctx.strokeStyle = '#e8ecf3'; ctx.lineWidth = 1.5;
  ctx.strokeRect(cx - carW / 2, groundY - carH, carW, carH);
  // 轮子
  ctx.fillStyle = '#222c40';
  ctx.beginPath(); ctx.arc(cx - 25, groundY + 3, 8, 0, 2 * Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 25, groundY + 3, 8, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = '#66d98a'; ctx.lineWidth = 1;
  ctx.stroke();

  // 摆杆（从车顶竖直向上，θ=0）
  const px = cx, py = groundY - carH;
  const Lpx = sim.pc_L * SCALE;
  const endX = px + Lpx * Math.sin(sim.theta);
  const endY = py - Lpx * Math.cos(sim.theta);
  ctx.strokeStyle = '#e8ecf3'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(endX, endY); ctx.stroke();

  // 杆端球（触发拖拽区域）
  const r = 14;
  const grad = ctx.createRadialGradient(endX - r * 0.3, endY - r * 0.3, r * 0.2, endX, endY, r);
  grad.addColorStop(0, '#ffd28a'); grad.addColorStop(1, '#ff8f3d');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(endX, endY, r, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = '#4d2e12'; ctx.lineWidth = 1.5; ctx.stroke();

  // 枢轴
  ctx.fillStyle = '#4fc3f7';
  ctx.beginPath(); ctx.arc(px, py, 6, 0, 2 * Math.PI); ctx.fill();

  // 标注
  ctx.fillStyle = '#8b96a8'; ctx.font = '12px sans-serif';
  ctx.fillText('m = ' + sim.pc_m.toFixed(2) + ' kg  M = ' + sim.M.toFixed(2) + ' kg', 12, 24);
  ctx.fillText('x = ' + sim.x.toFixed(3) + ' m   θ = ' + (sim.theta * DEG).toFixed(1) + '°', 12, 42);
}

// ==================== 拖拽 ====================
function canvasPoint(e) {
  const rect = cv.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (cvW / rect.width),
    y: (e.clientY - rect.top) * (cvH / rect.height)
  };
}
function angleFrom(p, px, py) {
  const dx = p.x - px, dy = p.y - py;
  return Math.atan2(dx, -dy);
}
cv.addEventListener('pointerdown', (e) => {
  const p = canvasPoint(e);
  if (sim.level === 3) {
    // 先判定摆球
    const groundY = 380, xscale = L3_XSCALE;
    const cx = cvW / 2 + sim.x * xscale;
    const py = groundY - 34;
    const endX = cx + sim.pc_L * SCALE * Math.sin(sim.theta);
    const endY = py - sim.pc_L * SCALE * Math.cos(sim.theta);
    const dBall = Math.hypot(p.x - endX, p.y - endY);
    const dCar = Math.hypot(p.x - cx, p.y - (groundY - 17));
    if (dBall < 40) { sim.dragging = 'ball'; }
    else if (dCar < 80) { sim.dragging = 'car'; }
    if (sim.dragging) { cv.setPointerCapture(e.pointerId); sim.paused = true; setRunningUI(); }
  } else {
    const d = Math.hypot(p.x - PIVOT.x, p.y - PIVOT.y);
    if (d > 25 && d < 220) {
      sim.dragging = 'ball';
      cv.setPointerCapture(e.pointerId);
      sim.paused = true; setRunningUI();
    }
  }
});
cv.addEventListener('pointermove', (e) => {
  if (sim.level === 3) {
    if (sim.dragging === 'ball') {
      const groundY = 380, xscale = L3_XSCALE;
      const cx = cvW / 2 + sim.x * xscale;
      const py = groundY - 34;
      sim.theta = clamp(angleFrom(canvasPoint(e), cx, py), -Math.PI, Math.PI);
      sim.omega = 0;
      drawCartPole();
    } else if (sim.dragging === 'car') {
      const xscale = L3_XSCALE;
      sim.x = clamp((canvasPoint(e).x - cvW / 2) / xscale, -(sim.trackMax - 0.1), sim.trackMax - 0.1);
      sim.xdot = 0;
      drawCartPole();
    }
  } else if (sim.dragging === 'ball') {
    sim.theta = clamp(angleFrom(canvasPoint(e), PIVOT.x, PIVOT.y), -Math.PI, Math.PI);
    sim.omega = 0;
    drawPendulum(sim.level === 2 ? 2 : 0);
  }
});
cv.addEventListener('pointerup', () => {
  if (sim.dragging) {
    sim.dragging = false;
    sim.omega = Math.random() * 0.3 - 0.15; // 释放给一点小扰动
    sim.paused = false;
    setRunningUI();
  }
});

const $ = (id) => document.getElementById(id);

function slider(id, label, min, max, step, def, unit, onInput) {
  return {
    type: 'slider', id, label, min, max, step, def, unit, onInput,
    render() {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<label>${label}</label>
        <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${def}">
        <span class="val" id="${id}-val">${def}${unit}</span>`;
      row.querySelector('input').addEventListener('input', (e) => {
        const v = parseFloat(e.target.value);
        row.querySelector('#' + id + '-val').textContent = v + unit;
        onInput(v);
      });
      return row;
    }
  };
}
function staticRow(label, getter) {
  return {
    type: 'static', label, getter,
    render() {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<label>${label}</label><span class="val" id="static-${label}" style="font-weight:700;">--</span>`;
      row._getter = getter;

    }

}
function pidInput(id, name, sub, def) {
  return {
    type: 'pid', id, name, sub, def,
    render() {
      const item = document.createElement('div');
      item.className = 'pid-item';
      item.innerHTML = `<div class="k">${name} <input type="number" inputmode="decimal" id="${id}" value="${def}" step="any" style="width:76px;background:var(--panel);border:1px solid #33405e;color:var(--text);border-radius:6px;padding:4px 6px;font-size:16px;font-weight:700;"></div>
        <div class="n">${sub}</div>`;
      const inp = item.querySelector('input');
      // 限幅类参数（umax/fmax/threfmax）设上限，防止力气无穷大
      const LIMITS = { umax: [1, 100], fmax: [1, 100], threfmax: [0.01, 0.5] };
      inp.addEventListener('input', (e) => {
        const v = parseFloat(e.target.value);
        if (!isNaN(v)) {
          const lim = LIMITS[id];
          const vv = lim ? clamp(v, lim[0], lim[1]) : v;
          if (lim && vv !== v) e.target.value = vv;
          onInputHook(vv, id);
        }
      });
      // 回车失去焦点：手机键盘确认后输入框自动收起，无需点空白处
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') inp.blur();
      });
      return item;
    }
  };
}

let lastTs = null;
function stepSim(now) {
  const realDt = lastTs === null ? 0 : Math.min((now - lastTs) / 1000, 0.1);
  lastTs = now;
  if (!sim.running || sim.paused) return;

  let samples = [];
  const L = LEVELS[sim.level];
  // 测量值总低通系数（Tf=0 时 alpha=1 直通，天然不滤波）：角度/位置独立
  const aMTh = CTRL_DT / (CTRL_DT + sim.measTfTh);
  const aMX = CTRL_DT / (CTRL_DT + sim.measTfX);
  for (let t = 0; t < realDt; t += CTRL_DT) {
    // ① 采样观测（带噪声）→ 测量值低通（作用于源头，整个 PID 用滤波后的值）
    sim.obsThetaPrev = sim.obsTheta;
    const rawTh = sim.theta + (sim.level === 3 ? sim.noiseSigmaTh : sim.noiseSigma) * gauss();
    sim.obsTheta = sim.obsTheta + aMTh * (rawTh - sim.obsTheta);
    const rawX = sim.x + (sim.level === 3 ? sim.noiseSigmaX : sim.noiseSigma * 0.4) * gauss();
    sim.obsX = sim.obsX + aMX * (rawX - sim.obsX);
    // ② 目标 + 控制（各关内自行维护积分/差分状态）
    sim.targetNow = L.target(sim.t);
    const u = L.ctrl();
    sim.uNow = u;
    // ③ 物理步进
    const steps = Math.round(CTRL_DT / PHYS_DT);
    for (let s = 0; s < steps; s++) {
      if (sim.level === 3) stepCartPole(u);
      else stepPendulum(u);
    }
    // ⑤ L3 碰边检测：出 ±5m 即失败，暂停等待重置
    if (sim.level === 3 && Math.abs(sim.x) > sim.trackMax) {
      sim.failed = true;
      sim.running = false;
      sim.paused = false;
      sim.x = clamp(sim.x, -sim.trackMax, sim.trackMax);
      setRunningUI();
      break;
    }
    samples.push({ t: sim.t, th: sim.theta, obs: sim.obsTheta, tg: sim.targetNow, xx: sim.x, ox: sim.obsX, up: sim.uKpNow, ui: sim.uKiNow, ud: sim.uKdNow, up2: sim.uKp2Now, ui2: sim.uKi2Now, ud2: sim.uKd2Now });
    sim.t += CTRL_DT;
  }
  for (const s of samples) {
    sim.bufT.push(s.t); sim.bufTrue.push(s.th);
    sim.bufObs.push(s.obs); sim.bufTgt.push(s.tg); sim.bufX.push(s.xx); sim.bufObsX.push(s.ox);
    sim.bufUKp.push(s.up); sim.bufUKi.push(s.ui); sim.bufUKd.push(s.ud);
    sim.bufUKp2.push(s.up2); sim.bufUKi2.push(s.ui2); sim.bufUKd2.push(s.ud2);
  }
  L.draw();
  updateStats(performance.now());
}

let lastChartUpdate = 0;
function updateChart(now) {
  if (!chart || sim.bufT.length === 0) return;
  // 节流：图表 4Hz 刷新足够，避免 60fps 全量 downsample

  lastChartUpdate = now === undefined ? performance.now() : now;
  chart.data.datasets[0].data = downsample(sim.bufT, sim.bufTrue.map(v => v * DEG));

  chart.data.datasets[2].data = downsample(sim.bufT, sim.bufTgt.map(v => v * DEG));
  chart.data.datasets[3].data = downsample(sim.bufT, sim.bufTrue.map((v, i) => (v - sim.bufTgt[i]) * DEG));

  if (chartU && sim.bufUKp.length) {

    chartU2.data.datasets[2].data = downsample(sim.bufT, sim.bufUKd2);
    chartU2.update('none');
  }
}

// ==================== 控制结果 ====================
// 指标定义：
//  L1/L3：5s 均方稳态误差(RMSE, t>=5s 窗口, 真值误差)、峰值误差、稳态带进入时间(连续3s不出带)
//  L2：最近一整圈的跟踪 RMSE（滑动窗口，目标每跨 360° 更新一次）
function computeResults() {
  const n = sim.bufT.length;
  if (n < 5) return null; // 数据太少
  const out = { rmse: null, peak: null, settle: null, circleRmse: null };
  if (sim.level === 2) {
    // 滚动窗口：找目标角最后一个周期起点（tgt 相对首值 ≥2π 的最后一个完整圈）
    const t0 = sim.bufTgt[0];
    // 全部满足 tgt[i]-t0 >= 2π 的索引中，从最后一个往前推一圈
    let lastFullIdx = -1;
    for (let i = n - 1; i >= 0; i--) {
      if (sim.bufTgt[i] - t0 >= 2 * Math.PI) { lastFullIdx = i; break; }
    }
    if (lastFullIdx > 0) {
      // 从 lastFullIdx 反推该圈起点：tgt 差正好 2π 的位置
      let startIdx = 0;
      for (let i = lastFullIdx - 1; i >= 0; i--) {
        if (sim.bufTgt[lastFullIdx] - sim.bufTgt[i] >= 2 * Math.PI) { startIdx = i + 1; break; }
      }
      let s2 = 0, cnt = 0;
      for (let i = startIdx; i <= lastFullIdx; i++) {
        const e = sim.bufTrue[i] - sim.bufTgt[i];
        s2 += e * e; cnt++;
      }
      if (cnt > 0) out.circleRmse = Math.sqrt(s2 / cnt) * DEG;
    }
    return out;
  }
  // L1/L3：真值误差（L3 用位置误差 x-0）
  const eArr = sim.bufTrue.map((v, i) => (v - sim.bufTgt[i]) * (sim.level === 3 ? 1 : DEG));
  // RMSE（t>=5s）
  let s2 = 0, cnt = 0;
  for (let i = 0; i < n; i++) {
    if (sim.bufT[i] >= 5) { s2 += eArr[i] * eArr[i]; cnt++; }
  }
  if (cnt > 0) out.rmse = Math.sqrt(s2 / cnt);
  // 峰值误差
  let pk = 0;
  for (let i = 0; i < n; i++) { const a = Math.abs(eArr[i]); if (a > pk) pk = a; }
  out.peak = pk;
  // 稳态带进入时间：连续 3s 不出带才算进入（L1 角度 2°、L3 位置 0.05m）
  const band = (sim.level === 3) ? 0.05 : 2;
  const HOLD_S = 3;                       // 确认时间
  const holdIdx = Math.round(HOLD_S / CTRL_DT);
  let settleT = null;
  outer:
  for (let i = 0; i + holdIdx < n; i++) {  // 必须后面完整 holdIdx 样本才判定
    if (Math.abs(eArr[i]) < band) {
      for (let j = i + 1; j < i + holdIdx; j++) {
        if (Math.abs(eArr[j]) >= band) continue outer;
      }
      settleT = sim.bufT[i];
      break;
    }
  }
  out.settle = settleT;
  return out;
}
let lastResultUpdate = 0;
function updateResult() {
  const now = performance.now();
  if (now - lastResultUpdate < 500) return; // 0.5s 刷新一次
  lastResultUpdate = now;
  const r = computeResults();
  const el = $('result-stats');
  const note = $('result-note');
  if (!r) {
    el.innerHTML = `<div class="stat"><div class="v" style="color:var(--muted);">--</div><div class="l">等待数据</div></div>`;
    note.textContent = '仿真运行几秒后显示';
    return;
  }
  if (sim.level === 2) {
    el.innerHTML =
      `<div class="stat"><div class="v" style="color:var(--green);">${r.circleRmse === null ? '--' : r.circleRmse.toFixed(2)}°</div><div class="l">一圈跟踪 RMSE</div></div>`;
    note.textContent = '定义：最近一整圈（目标角跨 360°）内跟踪误差的均方根，随仿真滚动刷新（Ki 需要非零才能消稳定滞后）';
    return;
  }
  const unit = (sim.level === 3) ? ' m' : '°';
  el.innerHTML =
    `<div class="stat"><div class="v" style="color:var(--green);">${r.rmse === null ? '--' : r.rmse.toFixed(3)}${unit}</div><div class="l">5s 均方稳态误差</div></div>` +
    `<div class="stat"><div class="v" style="color:var(--blue);">${r.peak === null ? '--' : r.peak.toFixed(3)}${unit}</div><div class="l">峰值误差</div></div>` +
    `<div class="stat"><div class="v" style="color:var(--orange);">${r.settle === null ? '未确认' : r.settle.toFixed(2) + 's'}</div><div class="l">稳态带进入时间</div></div>`;
  note.textContent = (sim.level === 3)
    ? '稳态带：|x| < 0.05m 且连续 3s 不出带；均方稳态误差取 t≥5s 的真值位置误差'
    : '稳态带：|θ|<2° 且连续 3s 不出带；均方稳态误差取 t≥5s 的真值角度误差';
}

function loop(now) {
  if (now !== undefined) stepSim(now);
  if (chart) updateChart(now);
  updateResult();
  requestAnimationFrame(loop);
}

function init() {
  buildLevelUI();
  applyInitial();
  setRunningUI();
  let params = new URLSearchParams(location.search);
  if (params.get('lvl')) {
    const lvl = parseInt(params.get('lvl'));
    if (lvl >= 1 && lvl <= 3) {
      sim.level = lvl;
      document.querySelectorAll('.level-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.lvl) === lvl));
      buildLevelUI();
      applyInitial();
      setRunningUI();
    }
  }
  if (params.get('preset') === 'ref' && sim.level === 3) {
    // 调试用：填入 L3 已验证参数（不影响同学探索界面）
    LEVELS[3].pidApply([120, 0, 18, 0.05, 30, 0.08, 0, 0.08, 0.05, 0.1, 0.05, 0.02]);
    refreshPidUI();
  }
  if (params.get('autorun') === '1') {
    sim.running = true;
    setRunningUI();
  }
  requestAnimationFrame(loop);
}
init();
</script>
</body>
</html>
